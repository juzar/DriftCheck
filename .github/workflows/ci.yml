name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run regression tests
        run: python3 -m unittest discover -s tests -v
      - name: Compile scripts
        run: python3 -m py_compile scripts/build_drift_report.py scripts/fetch_github_pull_requests.py
